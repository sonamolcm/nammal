<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nammal Admin - Login</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body class="login-body">
    <div class="login-container glass">
        <div class="login-header">
            <ion-icon name="heart" class="logo-icon large"></ion-icon>
            <h2>Admin Login</h2>
            <p>Enter your superadmin credentials to continue</p>
        </div>
        
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="alert {{ message.tags }} glass">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        
        <form method="POST" action="{% url 'admin_panel:login' %}" class="login-form">
            {% csrf_token %}
            <div class="input-group">
                <label>Username</label>
                <div class="input-wrapper">
                    <ion-icon name="person-outline"></ion-icon>
                    <input type="text" name="username" placeholder="Superadmin Username" required>
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">Sign In to Dashboard</button>
        </form>
    </div>
</body>
</html>
